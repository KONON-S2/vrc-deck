<!DOCTYPE html>
<html><head lang="en"><title>Avatar Height Set</title><meta charset="utf-8" />
<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
<style>
.height-control { display: flex; align-items: center; gap: 8px; width: 100%; }
.target-value { flex: 0 0 58px; min-width: 0; box-sizing: border-box; color: #fff; background: #3a3a3a; border: 1px solid #555; border-radius: 3px; padding: 5px 6px; text-align: center; }
.target-slider { flex: 1 1 auto; min-width: 0; margin: 0; }
</style></head>
<body>
<sdpi-item label="Height (m)"><div class="height-control"><input class="target-value" type="text" inputmode="decimal" value="1.60" aria-label="Target height" /><input class="target-slider" type="range" min="0.1" max="100" step="0.1" value="1.6" aria-label="Target height slider" /></div></sdpi-item>
<script src="avatar-height-set.js"></script>
</body></html>
