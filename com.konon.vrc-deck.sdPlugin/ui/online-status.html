<!DOCTYPE html>
<html>
<head lang="en">
    <title>Online Status</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        .status-picker { position: relative; width: 100%; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .status-picker-button { display: flex; align-items: center; gap: 7px; width: 100%; box-sizing: border-box; padding: 6px 8px; color: #fff; background: #3a3a3a; border: 1px solid #555; border-radius: 3px; cursor: pointer; text-align: left; }
        .status-picker-button::after { content: "▾"; margin-left: auto; color: #bbb; }
        .status-picker-menu { display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); border: 1px solid #555; border-radius: 3px; background: #2d2d2d; box-shadow: 0 3px 8px #0008; }
        #status-mode { width: 100%; box-sizing: border-box; padding: 6px 8px; color: #fff; background: #3a3a3a; border: 1px solid #555; border-radius: 3px; }
        .status-picker.open .status-picker-menu { display: block; }
        sdpi-item.status-disabled { opacity: .4; pointer-events: none; }
        .status-picker.disabled .status-picker-button { cursor: not-allowed; }
        .status-option { display: flex; align-items: center; gap: 7px; padding: 7px 8px; color: #fff; cursor: pointer; }
        .status-option:hover { background: #444; }
        .status-dot { display: inline-block; flex: 0 0 10px; width: 10px; height: 10px; border-radius: 50%; }
        #online-settings.login-disabled { opacity: .38; pointer-events: none; }
        #login-required { display: none; margin: 10px 8px 4px 72px; color: #ff6b6b; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.45; }
    </style>
</head>
<body>
    <div id="online-settings">
        <sdpi-item label="Mode">
            <select id="status-mode">
                <option value="cycle">Cycle</option>
                <option value="toggle">Toggle</option>
                <option value="set">Set</option>
            </select>
        </sdpi-item>

        <div id="status-settings">
            <sdpi-item label="State 1">
                <div class="status-picker" data-setting="toggleStatusOne" data-default="active"></div>
            </sdpi-item>
            <sdpi-item label="State 2">
                <div class="status-picker" data-setting="toggleStatusTwo" data-default="busy"></div>
            </sdpi-item>
        </div>
    </div>
    <div id="login-required">VRC login is required. Add a VRC Login button to your Stream Deck and sign in.</div>

    <script src="online-status.js"></script>
</body>
</html>
