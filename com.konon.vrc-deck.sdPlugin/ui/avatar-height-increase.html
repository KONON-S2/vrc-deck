<!DOCTYPE html>
<html><head lang="en"><title>Avatar Height Increase</title><meta charset="utf-8" />
<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
<style>
.height-control { display: flex; align-items: center; gap: 8px; width: 100%; }
.height-value, .repeat-value, .limit-value { flex: 0 0 58px; min-width: 0; box-sizing: border-box; color: #fff; background: #3a3a3a; border: 1px solid #555; border-radius: 3px; padding: 5px 6px; text-align: center; }
.height-slider, .repeat-slider, .limit-slider { flex: 1 1 auto; min-width: 0; margin: 0; }
</style></head>
<body>
<sdpi-item label="Change (m)"><div class="height-control"><input class="height-value" type="text" inputmode="decimal" value="0.10" aria-label="Height change" /><input class="height-slider" type="range" min="0.01" max="1" step="0.01" value="0.1" aria-label="Height change slider" /></div></sdpi-item>
<sdpi-item label="Maximum (m)"><div class="height-control"><input class="limit-value" type="text" inputmode="decimal" value="5.0" aria-label="Maximum height" /><input class="limit-slider" type="range" min="0.1" max="100" step="0.1" value="5" aria-label="Maximum height slider" /></div></sdpi-item>
<sdpi-item label="Repeat (ms)"><div class="height-control"><input class="repeat-value" type="text" inputmode="numeric" value="250" aria-label="Repeat delay" /><input class="repeat-slider" type="range" min="20" max="2000" step="10" value="250" aria-label="Repeat delay slider" /></div></sdpi-item>
<sdpi-item><div style="line-height: 1.5;">Repeat sets the delay between changes while the button is held.</div></sdpi-item>
<script src="avatar-height.js"></script>
</body></html>
