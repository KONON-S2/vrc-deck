<!DOCTYPE html>
<html>
<head lang="en">
    <title>VRC Login</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        .login-panel { padding: 4px 8px; color: #fff; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .field { margin-bottom: 10px; }
        .field label { display: block; margin-bottom: 4px; color: #ccc; }
        .field input { width: 100%; box-sizing: border-box; padding: 6px 8px; color: #fff; background: #3a3a3a; border: 1px solid #555; border-radius: 3px; }
        .password-row { display: flex; align-items: center; gap: 6px; }
        .password-row input { flex: 1; min-width: 0; }
        .password-toggle { flex: 0 0 auto; padding: 5px 8px; color: #fff; background: #4a4a4a; border: 1px solid #666; border-radius: 3px; cursor: pointer; }
        .button-row { display: flex; gap: 6px; }
        button.action { flex: 1; padding: 7px; color: #fff; background: #1473e6; border: 0; border-radius: 3px; cursor: pointer; }
        button.secondary { background: #555; }
        button:disabled { opacity: .55; cursor: default; }
        #two-factor, #logged-in { display: none; }
        #status { margin-top: 10px; min-height: 16px; color: #bbb; overflow-wrap: anywhere; }
        #status.error { color: #ff8585; }
        #account { margin-bottom: 10px; color: #8fd18f; }
        #remove-hint { margin: 10px 0; color: #bbb; line-height: 1.45; }
    </style>
</head>
<body>
    <div class="login-panel">
        <div id="credentials">
            <div class="field">
                <label for="identifier">Email or ID</label>
                <input id="identifier" type="text" autocomplete="username" />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="password-row">
                    <input id="password" type="password" autocomplete="current-password" />
                    <button id="toggle-password" class="password-toggle" type="button">Show</button>
                </div>
            </div>
            <button id="login" class="action" type="button">Login</button>
        </div>

        <div id="two-factor">
            <div class="field">
                <label for="code">Authentication code</label>
                <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" />
            </div>
            <div class="button-row">
                <button id="verify" class="action" type="button">Verify</button>
                <button id="cancel" class="action secondary" type="button">Cancel</button>
            </div>
        </div>

        <div id="logged-in">
            <div id="account"></div>
            <div id="remove-hint">Login complete. You may now remove this VRC Login button from your Stream Deck.</div>
            <button id="logout" class="action secondary" type="button">Logout</button>
        </div>

        <div id="status">Checking login status...</div>
    </div>
    <script src="vrc-login.js"></script>
</body>
</html>
