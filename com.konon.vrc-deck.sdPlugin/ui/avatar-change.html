<!DOCTYPE html>
<html>
<head lang="en">
    <title>Avatar Change</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        #avatar-search { width: calc(100% + 20px); margin-left: -10px; box-sizing: border-box; color: #fff; font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #3a3a3a; border: 1px solid #555; border-radius: 3px; padding: 5px 7px; }
        #avatar-results { display: none; max-height: 260px; overflow-y: scroll; scrollbar-gutter: stable; margin: 4px 4px 8px 72px; border: 1px solid #555; border-radius: 3px; background: #2d2d2d; color: #fff; font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #avatar-results::-webkit-scrollbar { width: 10px; }
        #avatar-results::-webkit-scrollbar-track { background: #242424; }
        #avatar-results::-webkit-scrollbar-thumb { background: #777; border: 2px solid #242424; border-radius: 5px; }
        .avatar-option { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid #444; }
        .avatar-option:hover { background: #3f3f3f; }
        .avatar-option img { width: 34px; height: 34px; border-radius: 3px; object-fit: cover; background: #222; }
        #avatar-status { margin: 3px 4px 8px 72px; color: #bdbdbd; font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow-wrap: anywhere; }
        #avatar-settings.login-disabled { opacity: .38; pointer-events: none; }
        #login-required { display: none; margin: 10px 8px 4px 72px; color: #ff6b6b; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.45; }
    </style>
</head>
<body>
    <div id="avatar-settings">
        <sdpi-item label="Avatar"><input id="avatar-search" type="text" placeholder="Search avatars..." autocomplete="off" /></sdpi-item>
        <div id="avatar-results"></div>
        <div id="avatar-status">Loading avatars...</div>
    </div>
    <div id="login-required">VRC login is required. Add a VRC Login button to your Stream Deck and sign in.</div>
    <script src="avatar-change.js"></script>
</body>
</html>
