<!DOCTYPE html>
<html>
<head lang="en">
    <title>Auto Chat</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Message">
        <sdpi-textarea setting="message" rows="5" maxlength="144" placeholder="Enter a message..."></sdpi-textarea>
    </sdpi-item>
    <sdpi-item>
        <sdpi-text>Up to 144 characters and 9 lines. Press the button to send immediately.</sdpi-text>
    </sdpi-item>
</body>
</html>
